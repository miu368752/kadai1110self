<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>問い合わせ登録</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<h2>レビュー登録</h2>

    <form th:action="@{/contact}" method="POST" 
	th:object="${contactForm}">
		【お名前】<br>
		<input type="text"  th:field="*{name}"><br>
		<div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-msg"></div>
		<br>
    	【メールアドレス】<br>
    	<input type="email" th:field="*{mail}"><br>
		<div th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}" class="error-msg"></div>
		<br>
    	【電話番号】<br>
    	<input type="number" th:field="*{phone}"><br>
		<div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error-msg"></div>
		<br>
    	【件名】<br>
		<input type="text" th:field="*{title}"><br>
		<div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error-msg"></div>
		<br>
		【お問い合わせ】<br>
		<textarea th:field="*{comment}" rows="5" cols="40"></textarea><br>
		<div th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" class="error-msg"></div>
		<br>
    	<input type="submit" value="送信" class="btn">
    </form>
	<form th:action="@{/contact}" method="POST"
			th:object="${contactresult}">
		<input type="hidden" th:field="*{name}">
		<input type="hidden" th:field="*{mail}">
		<input type="hidden" th:field="*{phone}">
		<input type="hidden" th:field="*{title}">
		<input type="hidden" th:field="*{comment}">
		<input type="submit" value="送信" class="btn">
	</form>

</body>
</html>
